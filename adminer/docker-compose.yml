# Adminer: a database client in the browser.

x-smartalfred:
  name: Adminer
  description: A small database client in the browser for PostgreSQL, MySQL/MariaDB, SQLite and more. Browse tables, run SQL, import and export. It sleeps when nobody uses it.
  category: Databases
  website: https://www.adminer.org
  variables:
    DATABASE_HOST:
      label: Database service
      description: The name of the database service in this project, filled in on the login page.
      default: postgres
  after: |
    Open ${SMARTALFRED_ADMINER_URL}, choose the kind of database, and log in with the database's own user and password. The server is the database service's name in this project (filled in: `${DATABASE_HOST}`).

    Adminer has no login of its own: anyone who finds the address sees the login page of your database. Delete the service when you're done, or keep the database password strong.

services:
  adminer:
    image: adminer:5
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ${DATABASE_HOST}
