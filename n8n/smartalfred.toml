# n8n: workflow automation.
# Licence: n8n is source-available under the Sustainable Use License, not an OSI open-source
# licence. Fine for your own and your company's internal use; read it before offering n8n to others.

[template]
name = "n8n"
description = "Workflow automation with a visual editor. Connect APIs, react to webhooks, run things on a schedule. Source-available (Sustainable Use License), free for your own use."
category = "Automation"
website = "https://n8n.io"
logo = "logo.svg"
after = """
Open ${{n8n.URL}} and create the owner account: the first person to open it sets it up, so do that right away.

Webhook URLs in your workflows start with ${{n8n.URL}}/webhook/

Keep the encryption key (`N8N_ENCRYPTION_KEY`, below): the credentials you save in n8n are encrypted with it.
"""

[template.inputs.TIMEZONE]
label = "Time zone"
description = "For schedules, e.g. Europe/Berlin or America/New_York."
default = "Europe/Berlin"

[services.n8n]
image = "n8nio/n8n:stable"
port = 5678
always_on = true                  # schedules and webhooks need it awake
health_path = "/healthz/readiness"

[services.n8n.env]
N8N_PORT = "5678"
N8N_PROTOCOL = "https"
N8N_EDITOR_BASE_URL = "${{n8n.URL}}"
WEBHOOK_URL = "${{n8n.URL}}/"
N8N_PROXY_HOPS = "1"              # it sits behind smartalfred's proxy
GENERIC_TIMEZONE = "${TIMEZONE}"
TZ = "${TIMEZONE}"
N8N_DIAGNOSTICS_ENABLED = "false"

[services.n8n.secrets]
N8N_ENCRYPTION_KEY = "generate"

[[services.n8n.volumes]]
name = "n8n-data"
path = "/home/node/.n8n"
