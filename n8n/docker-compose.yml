x-smartalfred:
  name: n8n
  description: Workflow automation with a visual editor. Connect APIs, react to webhooks, run things on a schedule. Source-available (Sustainable Use License), free for your own use.
  category: Automation
  website: https://n8n.io
  variables:
    N8N_ENCRYPTION_KEY:
      generate: hex
    TIMEZONE:
      label: Time zone
      description: For schedules, e.g. Europe/Berlin or America/New_York.
      default: Europe/Berlin
  after: |
    Open ${SMARTALFRED_N8N_URL} and create the owner account: the first person to open it sets it up, so do that right away.

    Webhook URLs in your workflows start with ${SMARTALFRED_N8N_URL}/webhook/

    Keep the encryption key (below): the credentials you save in n8n are encrypted with it.

services:
  n8n:
    image: n8nio/n8n:stable
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: ${SMARTALFRED_N8N_HOST}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: ${SMARTALFRED_N8N_URL}
      WEBHOOK_URL: ${SMARTALFRED_N8N_URL}/
      # It sits behind smartalfred's proxy.
      N8N_PROXY_HOPS: "1"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
    labels:
      # Schedules and webhooks need it awake.
      smartalfred.always_on: "true"
      smartalfred.health_path: /healthz/readiness

volumes:
  n8n-data:
