# GlitchTip: error tracking that works with Sentry's SDKs. MIT licence.

[template]
name = "GlitchTip"
description = "Error tracking and performance monitoring for your apps, compatible with Sentry's SDKs. See what breaks right after a deploy. Light on memory (about 512 MB)."
category = "Monitoring"
website = "https://glitchtip.com"
after = """
The first start sets up its database and takes two to three minutes; until then the dashboard may say it didn't answer in time. That clears by itself.

Then open ${{glitchtip.URL}} and register: the first account can create the organization. Then create a project there and put its DSN into your app's Sentry SDK.

Emails (invitations, alerts) are only written to the log for now. To send them, set `EMAIL_URL` in the glitchtip service's variables, e.g. `smtp://user:password@host:587`. Once your team has signed up, set `ENABLE_USER_REGISTRATION` to `False`.
"""

[template.inputs.FROM_EMAIL]
label = "Sender address"
description = "The address its emails come from. Emails are only written to the log until you set EMAIL_URL to an SMTP server in the service's variables."
default = "glitchtip@example.com"

[services.glitchtip]
image = "glitchtip/glitchtip:6"
port = 8000
always_on = true                  # errors arrive at any time
health_path = "/_health/"

[services.glitchtip.env]
DATABASE_URL = "${{glitchtip-db.DATABASE_URL}}"
GLITCHTIP_DOMAIN = "${{glitchtip.URL}}"
DEFAULT_FROM_EMAIL = "${FROM_EMAIL}"
EMAIL_URL = "consolemail://"
# Web and background worker in one container; PostgreSQL does the queueing (no Valkey needed).
SERVER_ROLE = "all_in_one"
VALKEY_URL = ""

[services.glitchtip.secrets]
SECRET_KEY = "generate"

[[services.glitchtip.volumes]]
name = "glitchtip-uploads"
path = "/code/uploads"

[databases.glitchtip-db]
engine = "postgres"
