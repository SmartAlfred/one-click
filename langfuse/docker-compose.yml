# Langfuse: tracing, prompt management and evaluation for LLM applications.
# After Langfuse's own docker-compose.yml (v4), with every secret generated and nothing but the
# web interface reachable from outside.

x-smartalfred:
  name: Langfuse
  description: Tracing, prompt management, evaluation and debugging for LLM apps and agents. The whole stack, six services with ClickHouse. Needs a server with at least 4 GB of free memory; 8 GB or more for real use.
  category: AI
  website: https://langfuse.com
  variables:
    ADMIN_EMAIL:
      label: Admin email
      description: The address you log in with.
      required: true
    ADMIN_PASSWORD:
      generate: password
      length: 24
    LANGFUSE_PUBLIC_KEY:
      generate: hex
      length: 32
      secret: false
    LANGFUSE_SECRET_KEY:
      generate: hex
      length: 40
    LANGFUSE_NEXTAUTH_SECRET:
      generate: hex
    LANGFUSE_SALT:
      generate: hex
    LANGFUSE_ENCRYPTION_KEY:
      generate: hex
      length: 64
    LANGFUSE_DB_PASSWORD:
      generate: password
    LANGFUSE_CLICKHOUSE_PASSWORD:
      generate: password
    LANGFUSE_REDIS_PASSWORD:
      generate: password
    LANGFUSE_STORAGE_PASSWORD:
      generate: password
  after: |
    The first start sets up two databases and takes a few minutes; until then the dashboard may say services didn't answer in time or restarted. That clears by itself.

    Then open ${SMARTALFRED_LANGFUSE_URL} and log in with `${ADMIN_EMAIL}` and the admin password (below). Nobody else can sign up: invite people from inside Langfuse.

    A first project is ready. For the Langfuse SDKs:

    ```
    LANGFUSE_HOST=${SMARTALFRED_LANGFUSE_URL}
    LANGFUSE_PUBLIC_KEY=pk-lf-${LANGFUSE_PUBLIC_KEY}
    LANGFUSE_SECRET_KEY=sk-lf-${LANGFUSE_SECRET_KEY}
    ```

    Not set up: attaching images and audio to traces (the SDKs would have to reach the file storage from outside, and it is private here), and email. The other passwords below are the stack's own; you only need them to look into its databases.

services:
  langfuse:
    image: docker.langfuse.com/langfuse/langfuse:4
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: ${SMARTALFRED_LANGFUSE_URL}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_STORAGE_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-storage:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_STORAGE_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-storage:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      # The admin and a first project are created on the first start; nobody can sign up after.
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_INIT_ORG_ID: main
      LANGFUSE_INIT_ORG_NAME: My organization
      LANGFUSE_INIT_PROJECT_ID: first-project
      LANGFUSE_INIT_PROJECT_NAME: First project
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${ADMIN_PASSWORD}
    labels:
      # Traces arrive at any time.
      smartalfred.always_on: "true"
      smartalfred.health_path: /api/public/health

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    expose:
      - "3030"
    environment:
      NEXTAUTH_URL: ${SMARTALFRED_LANGFUSE_URL}
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_STORAGE_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-storage:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_STORAGE_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-storage:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

  langfuse-db:
    image: postgres:17-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    expose:
      - "8123"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server

  langfuse-redis:
    image: valkey/valkey:9-alpine
    expose:
      - "6379"
    environment:
      # The image adds these to the server's command line. Queues must never be evicted.
      VALKEY_EXTRA_FLAGS: --requirepass ${LANGFUSE_REDIS_PASSWORD} --maxmemory-policy noeviction
    volumes:
      - langfuse-redis-data:/data

  langfuse-storage:
    # S3-compatible storage for the raw events, as in Langfuse's own compose file. MinIO's
    # open-source edition is no longer developed upstream; here it's reachable only by Langfuse.
    image: cgr.dev/chainguard/minio
    expose:
      - "9000"
    entrypoint: ["sh", "-c"]
    # Makes the bucket (a directory) before the server starts.
    command: ["mkdir -p /data/langfuse && minio server --address :9000 --console-address :9001 /data"]
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_STORAGE_PASSWORD}
    volumes:
      - langfuse-storage-data:/data

volumes:
  langfuse-db-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-redis-data:
  langfuse-storage-data:
