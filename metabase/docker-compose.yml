# Metabase (open-source edition): dashboards and questions on your data.

x-smartalfred:
  name: Metabase
  description: Ask questions of your data and build dashboards, with or without SQL. The open-source edition, with its own PostgreSQL for settings and saved questions. Needs about 2 GB of memory.
  category: Analytics
  website: https://www.metabase.com
  variables:
    METABASE_DB_PASSWORD:
      generate: password
  after: |
    The first start takes a minute or two; until then the dashboard may say it didn't answer in time. That clears by itself.

    Then open ${SMARTALFRED_METABASE_URL} and follow the setup: the first person to open it becomes the admin.

    To look at a database in this project, add it in Metabase with the database service's name as the host (for example `postgres`, port 5432).

services:
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_SITE_URL: ${SMARTALFRED_METABASE_URL}
      MB_ANON_TRACKING_ENABLED: "false"
    labels:
      # It takes a minute to start: too long to wake for a visitor.
      smartalfred.always_on: "true"
      smartalfred.health_path: /api/health

  metabase-db:
    image: postgres:17-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data

volumes:
  metabase-db-data:
