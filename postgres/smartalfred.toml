# PostgreSQL: the database most projects start with, made the way the dashboard makes one.

[template]
name = "PostgreSQL"
description = "The standard database for almost any project. Private and always running, with a snapshot every day; the project's other services reach it by reference."
category = "Databases"
website = "https://www.postgresql.org"
after = """
Give it to the app that uses it: open **postgres** in the project and choose **Connect an app**. The app gets `DATABASE_URL` as a reference,

`${{postgres.DATABASE_URL}}`

which smartalfred fills in with the connection URL, password and all, and keeps up to date. Write the same in an app's own smartalfred.toml.

Its page also has a prompt in it (`psql`), and how to reach it from your own machine.
"""

[databases.postgres]
