# Meilisearch: fast full-text search with a simple API.

x-smartalfred:
  name: Meilisearch
  description: Full-text search for websites, products and documents. Typo-tolerant, fast, and a single service; the master key is generated for you.
  category: Search
  website: https://www.meilisearch.com
  variables:
    MEILI_MASTER_KEY:
      generate: password
      length: 40
  after: |
    The search API is at ${SMARTALFRED_MEILISEARCH_URL}

    Requests need a key. The master key (below) is for setting things up: use it to create an index and to read the two default keys at `/keys`, then give your app the **search** key and your backend the **admin** key, not the master key.

    The project's other services reach it at `http://meilisearch:7700`.

services:
  meilisearch:
    # Meilisearch's data format changes between versions: pinned to a minor, upgrade on purpose.
    image: getmeili/meilisearch:v1.54
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    labels:
      # Search should answer at once, not after a wake-up.
      smartalfred.always_on: "true"
      smartalfred.health_path: /health

volumes:
  meilisearch-data:
