# Umami: web analytics you host yourself.
# Works as a plain compose file too:
#   POSTGRES_PASSWORD=... APP_SECRET=... docker compose up

x-smartalfred:
  name: Umami
  description: Privacy-friendly web analytics you host yourself. A simple, fast alternative to Google Analytics, without cookies.
  category: Analytics
  website: https://umami.is
  variables:
    POSTGRES_PASSWORD:
      generate: password
    APP_SECRET:
      generate: hex
  after: |
    Open the address of the **umami** service and log in with the username `admin` and the password `umami`.
    Change that password right away under **Settings → Profile**, then add your website and copy its tracking code.

services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${APP_SECRET}
    depends_on:
      - umami-db
    labels:
      # It collects page views around the clock: don't let it sleep.
      smartalfred.always_on: "true"
      smartalfred.health_path: /api/heartbeat

  umami-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data

volumes:
  umami-db-data:
